
<!DOCTYPE html>
<html>
<head>
    <title>My Products - NovaMart</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f5ff;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #174ea6;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>My Products</h2>

    {% if products %}
    <table>
        <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
        </tr>
        {% for product in products %}
        <tr>
            <td>{{ product.name }}</td>
            <td>{{ product.category }}</td>
            <td>₹{{ product.price }}</td>
            <td>{{ product.stock }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
        <p>No products added yet.</p>
    {% endif %}

    <p><a href="{{ url_for('seller_dashboard') }}">Back to Dashboard</a></p>
</div>
</body>
</html>
