
<!DOCTYPE html>
<html>
<head>
    <title>Seller Dashboard - NovaMart</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f5ff;
            text-align: center;
            padding: 50px;
        }
        .dashboard {
            background: white;
            padding: 35px;
            border-radius: 12px;
            max-width: 650px;
            margin: auto;
        }
        h1 {
            color: #174ea6;
        }
        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 20px;
            background: #174ea6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <h1>Welcome to NovaMart!</h1>
        <h2>Seller Dashboard</h2>

        <h3>Hello, {{ name }}!</h3>

        <p>Manage your products and customer orders.</p>

        <a href="{{ url_for('add_product') }}">Add Product</a>
        <a href="{{ url_for('my_products') }}">My Products</a>
        <a href="{{ url_for('manage_orders') }}">Manage Orders</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</body>
</html>
